name: Refresh Dynamic Seed Keywords

# 매일 22:00 UTC = 07:00 KST. generate-post cron(08:00 KST)보다 1시간 전.
# trending은 빠르게 묵으므로 매일 갱신해야 신선도 유지.
on:
  schedule:
    - cron: '0 22 * * *'

  # Actions 탭에서 수동 실행 가능 — 첫 풀 채울 때 사용
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh seed keywords
        run: npm run refresh-seeds
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          SUPABASE_ADMIN_EMAIL: ${{ secrets.SUPABASE_ADMIN_EMAIL }}
          SUPABASE_ADMIN_PASSWORD: ${{ secrets.SUPABASE_ADMIN_PASSWORD }}
