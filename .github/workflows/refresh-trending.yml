name: Refresh Trending Topics

# 2026-09-08부터 자동 실행은 generate-post.yml의 첫 스텝으로 옮겼다.
# (이 파일의 cron이 7/23~9/7 원인불명으로 6주간 안 돌아 트렌딩이 7월 재고로만 돌아갔음.)
# 여기는 수동 실행(테스트·긴급 갱신) 전용으로만 남긴다. 스케줄을 다시 넣으면 하루 두 번 돈다.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh trending topics
        run: npm run refresh-trending
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          SUPABASE_ADMIN_EMAIL: ${{ secrets.SUPABASE_ADMIN_EMAIL }}
          SUPABASE_ADMIN_PASSWORD: ${{ secrets.SUPABASE_ADMIN_PASSWORD }}
          # 네 기둥(과학/AI/경제/교육) 주제 필터용 — 없으면 그날 트렌딩 적재를 건너뜀
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
