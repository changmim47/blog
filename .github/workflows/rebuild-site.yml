name: Rebuild Site

# 정적 익스포트라 게시글은 "빌드 시점"에 HTML로 구워진다.
# 따라서 초안을 발행한 뒤에는 사이트를 다시 빌드해야 새 글이 노출된다.
#
# 자동화(권장): Supabase Database Webhook을 posts 테이블 UPDATE에 걸어
#   Render Deploy Hook URL로 POST 하도록 설정하면 발행 즉시 재빌드된다.
# 이 워크플로는 그 백업용 수동 트리거다. Actions 탭에서 직접 실행한다.

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render rebuild
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret이 설정되지 않았습니다."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render 재빌드를 요청했습니다."
